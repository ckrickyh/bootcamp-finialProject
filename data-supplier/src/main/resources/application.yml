server:
  port: 8090

service:
  finnhub:
    host: "finnhub.io"
    api:
      quote:
        version: "api/v1"
        endpoint: "/quote"
        key-value: ${FINNHUB_QUOTE_API_KEY_1}
        key-value2: ${FINNHUB_QUOTE_API_KEY_2}
        key-value3: ${FINNHUB_QUOTE_API_KEY_3}
        key-value4: ${FINNHUB_QUOTE_API_KEY_4}

      history:
        version: "api/v1"
        endpoint: "profile2"
        key-value: ${FINNHUB_HISTORY_API_KEY_1}
        key-value2: ${FINNHUB_HISTORY_API_KEY_2}
        key-value3: ${FINNHUB_HISTORY_API_KEY_3}
        key-value4: ${FINNHUB_HISTORY_API_KEY_4}
        key-value5: ${FINNHUB_HISTORY_API_KEY_5}

