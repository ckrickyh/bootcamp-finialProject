name: Update FYP history database

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Run offline tests
        run: python -m unittest discover -s pythonProjects/tests -v
      - name: Fetch and write stock history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pythonProjects/FYPHistory2DB.py
